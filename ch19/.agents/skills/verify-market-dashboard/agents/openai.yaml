interface:
  display_name: "시장 대시보드 배포 검증"
  short_description: "공유 전 시장 대시보드의 프로덕션 상태를 읽기 전용으로 검증"
  default_prompt: "$verify-market-dashboard로 공유 전 프로덕션 배포 상태를 최종 검증해줘."

dependencies:
  tools:
    - type: "mcp"
      value: "vercel"
      description: "프로덕션 배포 상태, 주소, 화면, 런타임 로그를 읽기 전용으로 확인하는 Vercel MCP"
