<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>실거래가 조회</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="query-panel" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">실거래가 조회</h1>
          <p>서울 강남구 아파트 매매 실거래가</p>
        </div>

        <form id="search-form" class="search-form">
          <label>
            지역 코드
            <input id="region-code" name="regionCode" inputmode="numeric" pattern="[0-9]{5}" value="11680" required>
          </label>
          <label>
            계약년월
            <input id="deal-ymd" name="dealYmd" inputmode="numeric" pattern="[0-9]{6}" placeholder="202401" required>
          </label>
          <label>
            페이지
            <input id="page-no" name="pageNo" type="number" min="1" value="1" required>
          </label>
          <label>
            행 수
            <input id="num-of-rows" name="numOfRows" type="number" min="1" value="10" required>
          </label>
          <button type="submit">조회</button>
        </form>
      </section>

      <section class="summary" aria-live="polite">
        <div>
          <span>조회 지역</span>
          <strong id="summary-region">-</strong>
        </div>
        <div>
          <span>계약월</span>
          <strong id="summary-month">-</strong>
        </div>
        <div>
          <span>거래 건수</span>
          <strong id="summary-count">-</strong>
        </div>
      </section>

      <p id="status-message" class="status-message" role="status">조회 조건을 입력하고 조회하세요.</p>

      <section class="table-wrap" aria-labelledby="table-title">
        <h2 id="table-title">거래 목록</h2>
        <table>
          <thead>
            <tr>
              <th>단지명</th>
              <th>법정동</th>
              <th>거래금액</th>
              <th>전용면적</th>
              <th>층</th>
              <th>계약일</th>
              <th>건축년도</th>
            </tr>
          </thead>
          <tbody id="transactions-body"></tbody>
        </table>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
